[package]
name = "disk-diff"
version = "0.1.0"
description = "High performance disk space analyzer and snapshot diff tool"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "disk_diff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
zstd = "0.13"
jwalk = "0.8"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
