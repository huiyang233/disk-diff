[package]
name = "disk-diff"
version = "0.1.0"
description = "High performance disk space analyzer and snapshot diff tool"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "disk_diff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
disk-diff-core = { path = "../../crates/core" }
tauri = { version = "2.2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
mimalloc = { version = "0.1", default-features = false }
